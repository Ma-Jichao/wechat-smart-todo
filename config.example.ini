; Placeholder configuration. Never commit your real etc directory.
[db]
host = 127.0.0.1
port = 5432
dbname = reminder
user = reminder
password_file = /opt/reminder-bot/etc/app.pw
connect_timeout = 10

[weixin]
base_url = https://ilinkai.weixin.qq.com
account_id = YOUR_BOT_ACCOUNT_ID
allowed_user_id = YOUR_WECHAT_USER_ID
token_file = /opt/reminder-bot/etc/weixin.token
long_poll_timeout_secs = 45
reconnect_backoff_base_secs = 1
reconnect_backoff_cap_secs = 30

[deepseek]
base_url = https://api.deepseek.com
model = YOUR_TOOL_CALLING_MODEL
api_key_file = /opt/reminder-bot/etc/deepseek.key
timeout_secs = 30

[delivery]
min_interval_secs = 3
max_attempts = 8
backoff_base_secs = 5
backoff_cap_secs = 900
backoff_jitter_ratio = 0.2
lease_secs = 120
rate_limit_cooldown_secs = 300
send_timeout_secs = 20

[digest]
hour = 8
minute = 0
timezone = Asia/Shanghai
due_scan_interval_secs = 15
digest_grace_hours = 6

[style]
model = YOUR_STYLE_MODEL
max_tokens = 2000
greeting = true
per_item_note = true
closing = true

[limits]
max_text_chars = 2000
context_ttl_hours = 72
clarify_ttl_minutes = 30
seen_retention_days = 30
inbox_retention_days = 90

[logging]
level = INFO
file = /opt/reminder-bot/log/bot.log
max_bytes = 10485760
backup_count = 5
